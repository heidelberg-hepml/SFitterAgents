run_name: higgs_benchmark_h100

fitter: flow
precision: double

likelihood: profile
sector: higgs
datacard: data/Higgs_Full_with_CtG.json

prescale:
  samples: 40960
  smc_steps: 5000
  mcmc_steps: 500
  smc_resampling_threshold: 0.3
  step_size: 0.004
  step_adjust_factor: 2
  target_acceptance: 0.33
  std_init: [10, 10, 1, 0.01, 10, 1, 1, 10, 10, 1, 1, 10, 1, 0.1, 0.1, 0.1, 0.1, 10, 0.1, 0.1]
    #std_init: [8.3057e+00, 4.1471e+00, 1.1195e+00, 6.0891e-03, 1.7118e+01, 2.5044e-01,
    #           1.8095e-01, 1.6750e+00, 3.7811e+00, 1.4447e+00, 2.4822e-01, 4.7072e+00,
    #           3.8538e-01, 2.9911e-01, 9.2017e-02, 4.3097e-02, 2.9517e-01, 6.8375e-01,
    #           3.8011e-02, 9.1418e-02]
  prior_width: 2

architecture:
  spline_bins: 16
  layers: 3
  hidden_nodes: 64
  spline_bound: 10

pretrain:
  batch_size: 1024
  epochs: 6
  mcmc_steps: 10
  log_interval: 1

training:
  lr: 1.e-3
  batch_size: 1024
  batches: 1000
  log_interval: 10
  steps: 4
  mcmc_type: standard
  mcmc_steps: 1
  mcmc_step_size: 0.001
  step_size_adjust: 1.5
  buffer_size: 256
  min_buffer_size: 30
  buffer_batches: 6
  buffer_replacement: False

sampling:
  batches: 1000
  batch_size: 100000
  lower_bound_quantile: 0.001
  upper_bound_quantile: 0.999
  margin_factor: 0.2
  marginal_bins_1d: 80
  marginal_bins_2d: 40
  profile_points_1d: 40
  profile_points_2d: 30
  weight_clip: 100
  weight_lower_bound_quantile: 0.001
  weight_upper_bound_quantile: 0.9999
  weight_bins: 50

profile_1d:
  batch_size: 100000
  gd_learning_rate: 1.e-1
  gd_steps: 100
  optimizer: lbfgs

profile_2d:
  batch_size: 100000
  gd_learning_rate: 1.e-1
  gd_steps: 100
  optimizer: lbfgs


