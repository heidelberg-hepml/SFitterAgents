# Intentionally empty SPANK plugstack.conf, bound over the host's configless plugstack.conf inside
# the container (see src/launcher/scheduler.py).
#
# Why: the host's plugstack.conf may `required` a site SPANK plugin that is (a) not present inside
# the image and/or (b) built for a different SLURM version than the image's slurm-client — either
# aborts in-container `sbatch` with "Failed to load plugin / Incompatible plugin version". The
# container needs none of those plugins; emptying plugstack.conf lets sbatch initialize its plugin
# stack cleanly while RPC to the controller stays fully functional.
